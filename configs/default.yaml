project:
  random_state: 42

training:
  logistic_regression:
    max_iter: 1000

  random_forest:
    n_estimators: 100
    max_depth: 20
    min_samples_split: 2
    min_samples_leaf: 5
    max_features: sqrt
    class_weight: balanced_subsample
    n_jobs: -1

tuning:
  sample_size: 50000
  n_iter: 2
  cv: 2
  scoring: balanced_accuracy
  n_jobs: -1

  random_forest:
    n_estimators:
      - 50
      - 100
      - 150

    max_depth:
      - 10
      - 20
      - 30
      - null

    min_samples_split:
      - 2
      - 5
      - 10

    min_samples_leaf:
      - 1
      - 3
      - 5

    max_features:
      - sqrt
      - log2
      - null

selection:
  metric: balanced_accuracy

prediction:
  output_filename: test_predictions.csv

dashboard:
  output_filename: index.html